<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ações Educativas - Itaquera</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#2b2bab">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <meta property="og:title" content="Ações Educativas - Itaquera">
  <meta property="og:description" content="Gestão das Ações Educativas do Sesc Mesa Brasil, Unidade de Itaquera. Acesse agora do seu celular, tablet ou computador!">
  <meta property="og:image" content="https://raw.githubusercontent.com/mesaque-zake/Eventos-Itaquera/refs/heads/main/social-Share.png">
  <meta property="og:url" content="https://mesaque-zake.github.io/Eventos-Itaquera/">
  <meta property="og:type" content="website">

  <style>
    :root {
      --primary-color: #4775f5;
      --deep-blue: #2b2bab;
      --accent-glow: #00d2ff;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--deep-blue);
    }

    /* Iframe com transição de entrada */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 1s ease-in;
    }
    
    iframe.loaded {
      opacity: 1;
    }

    /* --- ESTILO DO SPLASH --- */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--deep-blue);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out, visibility 0.8s;
      overflow: hidden;
      padding-top: env(safe-area-inset-top); 
      box-sizing: border-box;
    }

    /* --- EFEITO NEON RÁPIDO --- */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
      opacity: 0.8;
      mix-blend-mode: screen;
    }

    .blob-1 {
      width: 350px; height: 350px;
      background: #FF0099;
      top: -100px; left: -100px;
      animation: neonRun1 4s infinite alternate ease-in-out;
    }

    .blob-2 {
      width: 400px; height: 400px;
      background: #00F0FF;
      bottom: -100px; right: -100px;
      animation: neonRun2 3.5s infinite alternate ease-in-out;
    }

    .blob-3 {
      width: 300px; height: 300px;
      background: #7B2FBE;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: neonRun3 5s infinite alternate-reverse ease-in-out;
    }

    @keyframes neonRun1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(80vw, 40vh) scale(1.2); }
    }

    @keyframes neonRun2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-60vw, -30vh) scale(0.8); }
    }

    @keyframes neonRun3 {
      0% { transform: translate(-50%, -50%) scale(0.5); }
      50% { transform: translate(20vw, 20vh) scale(1.5); }
      100% { transform: translate(-20vw, -40vh) scale(0.5); }
    }

    /* Camada de Vidro */
    #glass-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.03);
      z-index: 1;
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* Container do Conteúdo */
    .logo-container {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #FFFFFF;
      width: 85%;
      max-width: 400px;
    }

    .animate-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }
    .delay-4 { animation-delay: 0.8s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-text {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 0px;
      opacity: 0.7;
      font-weight: 300;
    }

    .brand-acoes {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(5rem, 18vw, 9rem); 
      margin: -5px 0;
      line-height: 1.1;
      background: linear-gradient(to bottom, #ffffff, #e0e0e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.2));
    }

    .brand-educativas {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.9rem, 4.5vw, 1.3rem);
      letter-spacing: 12px;
      margin-top: -10px;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    /* --- SELEÇÃO DE UNIDADE (GLASSMORPHISM) COMPACTO --- */
    .unit-selector-container {
      margin-top: 25px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px; 
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 18px 20px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .selector-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 2px 0;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    .unit-options {
      display: flex;
      gap: 8px;
      width: 100%;
      flex-wrap: wrap; 
      justify-content: center;
    }

    .unit-card {
      flex: 1 1 auto;
      min-width: 80px;
      padding: 10px 8px; 
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .unit-card:active {
      transform: scale(0.95);
    }

    .unit-card.selected {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }

    .glass-btn {
      margin-top: 4px;
      width: 100%;
      padding: 12px; 
      background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .glass-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .glass-btn:not(:disabled):active {
      transform: scale(0.96);
    }

    .glass-btn.shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      background: rgba(255, 60, 60, 0.2);
      border-color: rgba(255, 60, 60, 0.4);
      color: #fff;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    /* Rodapé intacto */
    .footer-splash {
      position: absolute;
      bottom: 40px;
      z-index: 10;
      text-align: center;
      width: 100%;
    }

    .mesa-logo {
      width: 80px;
      margin-bottom: 8px;
      opacity: 0.6;
      filter: brightness(0) invert(1);
      transition: opacity 0.3s;
    }

    .powered-by {
      font-size: 0.65rem;
      opacity: 0.4;
      letter-spacing: 1px;
      color: #FFFFFF;
      font-weight: 300;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Regra de Proteção para Telas Baixas */
    @media (max-height: 700px) {
      .brand-acoes { font-size: clamp(4rem, 15vw, 6rem); }
      .unit-selector-container { margin-top: 15px; }
      .footer-splash { bottom: 15px; }
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div> 
    <div id="glass-overlay"></div>
    
    <div class="logo-container">
      <div class="welcome-text animate-up delay-1">Bem-vindo a</div>
      <h1 class="brand-acoes animate-up delay-2">Ações</h1>
      <h2 class="brand-educativas animate-up delay-3">Educativas</h2>
      
      <div class="unit-selector-container animate-up delay-4">
        <p class="selector-title">Selecione sua unidade</p>
        
        <div class="unit-options">
          <div class="unit-card" data-unit="itaquera">Itaquera</div>
          <div class="unit-card" data-unit="carmo">Carmo</div>
        </div>
        
        <button id="confirm-btn" class="glass-btn" disabled>Confirmar</button>
      </div>
    </div>

    <div class="footer-splash animate-up delay-4">
      <img src="MesaLogo.png" alt="Logo" class="mesa-logo">
      <div class="powered-by">
        Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong>
      </div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     style="border:none; width: 100%; height: 100%;"
     allow="geolocation; microphone; camera; clipboard-write"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-presentation"
  ></iframe>
  
  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const unitCards = document.querySelectorAll('.unit-card');
    const confirmBtn = document.getElementById('confirm-btn');
    let selectedUnit = null;
    let isAppOpen = false;

    // Dicionário de Rotas
    const unitLinks = {
      itaquera: "https://script.google.com/macros/s/AKfycbwWmkTFQ4xvbjDpiW_HGqnK69H2faNvjwAj4CbX4RZBfxdjUwVaXE6TmH12BL_VkKWE/exec",
      carmo: "https://script.google.com/macros/s/AKfycbyiRtXfM_TVGZzWS8qnFwALKpmm0_gEYjtXXyygcywQ5F0WXpRk2WcVIOU27Sd7MUu3/exec"
    };

    // 1. Configura a tela de Splash como o "Ponto Zero" no histórico do navegador
    history.replaceState({ screen: 'splash' }, '', window.location.pathname);

    unitCards.forEach(card => {
      card.addEventListener('click', () => {
        unitCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedUnit = card.getAttribute('data-unit');
        confirmBtn.disabled = false;
      });
    });

    // 2. Função de revelação agora cria um histórico (Push State)
    const revealSystem = (unitId) => {
      if (!isAppOpen) {
        isAppOpen = true;
        // Diz ao celular/navegador que entramos em uma nova "página"
        history.pushState({ screen: 'app' }, '', `#${unitId}`);
        
        splash.classList.add('hidden');
        iframe.classList.add('loaded');
        confirmBtn.innerText = "Confirmar";
        confirmBtn.disabled = false;
      }
    };

    confirmBtn.addEventListener('click', () => {
      if (!selectedUnit) return;

      const linkDaUnidade = unitLinks[selectedUnit];

      if (!linkDaUnidade || linkDaUnidade === "") {
        const originalText = confirmBtn.innerText;
        confirmBtn.innerText = "Em construção 🚧";
        confirmBtn.classList.add('shake');
        confirmBtn.disabled = true;

        setTimeout(() => {
          confirmBtn.innerText = originalText;
          confirmBtn.classList.remove('shake');
          confirmBtn.disabled = false;
        }, 2500);

      } else {
        confirmBtn.innerText = "Carregando sistema...";
        confirmBtn.disabled = true;
        iframe.src = linkDaUnidade; // O sistema começa a carregar apenas agora
        
        iframe.onload = () => revealSystem(selectedUnit);
        setTimeout(() => revealSystem(selectedUnit), 8000); 
      }
    });

    // 3. O Segredo: Interceptando o botão "Voltar" do celular/navegador
    window.addEventListener('popstate', (event) => {
      // Se o usuário voltar e o estado for o 'splash' (Ponto Zero)
      if (event.state && event.state.screen === 'splash') {
        isAppOpen = false;
        
        // Esconde o iframe e mostra a tela de vidro
        splash.classList.remove('hidden');
        iframe.classList.remove('loaded');
        
        // Esvazia o iframe para não consumir memória nem áudio em background
        iframe.src = 'about:blank'; 
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado!', reg.scope))
          .catch(err => console.log('SW falhou:', err));
      });
    }
  </script>
</body>
</html>
