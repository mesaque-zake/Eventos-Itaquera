<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Itaquera</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <meta name="theme-color" content="#2b2bab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <style>
    :root {
      --deep-blue: #2b2bab;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--deep-blue);
      color: #ffffff;
    }

    /* --- OFFLINE TOAST --- */
    #offline-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 60, 60, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 60, 60, 0.4);
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #offline-toast.show { top: env(safe-area-inset-top, 20px); }

    /* --- IFRAME BLINDADO --- */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease-in, visibility 0.6s;
      background-color: var(--deep-blue);
    }
    iframe.loaded {
      opacity: 1;
      visibility: visible;
    }

    /* --- SPLASH E NEON --- */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--deep-blue);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      transition: opacity 0.6s ease-out, visibility 0.6s;
      overflow: hidden;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
      opacity: 0.8;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .blob-1 { width: 350px; height: 350px; background: #FF0099; top: -100px; left: -100px; animation: neonRun1 4s infinite alternate ease-in-out; }
    .blob-2 { width: 400px; height: 400px; background: #00F0FF; bottom: -100px; right: -100px; animation: neonRun2 3.5s infinite alternate ease-in-out; }
    .blob-3 { width: 300px; height: 300px; background: #7B2FBE; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: neonRun3 5s infinite alternate-reverse ease-in-out; }

    @keyframes neonRun1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(80vw, 40vh) scale(1.2); } }
    @keyframes neonRun2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-60vw, -30vh) scale(0.8); } }
    @keyframes neonRun3 { 0% { transform: translate(-50%, -50%) scale(0.5); } 50% { transform: translate(20vw, 20vh) scale(1.5); } 100% { transform: translate(-20vw, -40vh) scale(0.5); } }

    #glass-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.03);
      z-index: 1;
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* --- COREOGRAFIA DA TIMELINE (CSS) --- */
    
    /* 1. Logo (Inicia no centro, move no 1.0s) */
    .footer-splash {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform: translate(-50%, 50%) scale(1.6);
      z-index: 10;
      text-align: center;
      width: 100%;
      animation: moveLogo 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: 1.0s;
    }
    @keyframes moveLogo {
      to { bottom: 30px; transform: translate(-50%, 0) scale(1); }
    }
    .mesa-logo { width: 80px; margin-bottom: 8px; opacity: 0.9; filter: brightness(0) invert(1); }
    .powered-by { font-size: 0.65rem; opacity: 0.6; letter-spacing: 1px; font-weight: 300; }

    /* Container Central */
    .center-content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 85%;
      max-width: 400px;
      margin-top: -50px; /* Compensa o espaço para ficar no centro ótico */
    }

    /* 2. Frase Bem Vindo (Aparece no 2.0s) */
    .hero-titles {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
      animation-delay: 2.0s;
    }
    .welcome-text { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 0px; opacity: 0.7; font-weight: 300; }
    .brand-acoes { 
      font-family: 'Dancing Script', cursive; 
      font-size: clamp(6.5rem, 22vw, 11rem); /* Aumentado consideravelmente */
      margin: -10px 0; /* Ajuste negativo sutil para não empurrar a palavra de baixo */
      line-height: 1.1; 
      background: linear-gradient(to bottom, #ffffff, #e0e0e0); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.2)); 
    }
    .brand-educativas { 
      font-family: 'Montserrat', sans-serif; 
      font-size: clamp(1.2rem, 5.5vw, 1.8rem); /* Aumentado proporcionalmente */
      letter-spacing: clamp(8px, 2vw, 14px); /* O espaçamento entre letras agora também é fluido */
      margin-top: -5px; 
      text-transform: uppercase; 
      font-weight: 700; 
      color: rgba(255, 255, 255, 0.9); 
      text-shadow: 0 2px 10px rgba(0,0,0,0.2); 
    }

    /* 3. Cartões (Aparecem no 2.5s) */
    .unit-selector-container {
      margin-top: 25px; 
      display: flex; flex-direction: column; align-items: center; gap: 12px; 
      background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 18px 20px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
      animation-delay: 2.5s;
    }
    
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    .selector-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 2px 0; color: rgba(255, 255, 255, 0.9); font-weight: 600; }
    .unit-options { display: flex; gap: 8px; width: 100%; justify-content: center; }
    .unit-card { flex: 1 1 auto; min-width: 80px; padding: 10px 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: rgba(255, 255, 255, 0.8); font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; text-align: center; user-select: none; -webkit-tap-highlight-color: transparent; }
    .unit-card:active { transform: scale(0.95); }
    .unit-card.selected { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.5); color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); font-weight: 600; }

    /* --- ESTADO DE TROCA (SWAP TEXT) --- */
    #swap-status {
      display: none;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulseText 1.5s infinite;
    }
    @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* --- BOTÃO FLUTUANTE (SWAP) E MODAL --- */
    #btn-swap-unit {
      position: fixed;
      bottom: 30px;
      right: 20px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.8);
      transition: all 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-swap-unit.visible { opacity: 1; visibility: visible; transform: scale(1); }
    #btn-swap-unit:active { transform: scale(0.9) rotate(180deg); transition: 0.2s; }

    #confirm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    #confirm-modal.active { opacity: 1; visibility: visible; }
    .modal-content { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 25px; border-radius: 20px; text-align: center; width: 80%; max-width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); transform: translateY(20px); transition: transform 0.3s ease; }
    #confirm-modal.active .modal-content { transform: translateY(0); }
    .modal-content p { margin: 0 0 20px 0; font-weight: 500; font-size: 1.1rem; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; }
    .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Montserrat', sans-serif; }
    .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-confirm { background: #fff; color: var(--deep-blue); }

    @media (max-height: 700px) {
      .brand-acoes { font-size: clamp(4rem, 15vw, 6rem); }
      @keyframes moveLogo { to { bottom: 15px; transform: translate(-50%, 0) scale(1); } }
    }
  </style>
</head>
<body>

  <div id="offline-toast"><span>&#9888;</span> Sem conexão de internet</div>

  <div id="splash">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div> 
    <div id="glass-overlay"></div>
    
    <div class="center-content">
      <div id="intro-ui">
        <div class="hero-titles">
          <div class="welcome-text">Bem-vindo a</div>
          <h1 class="brand-acoes">Ações</h1>
          <h2 class="brand-educativas">Educativas</h2>
        </div>
        
        <div class="unit-selector-container">
          <p class="selector-title">Selecione sua unidade</p>
          <div class="unit-options">
            <div class="unit-card" data-unit="itaquera">Itaquera</div>
            <div class="unit-card" data-unit="carmo">Carmo</div>
          </div>
        </div>
      </div>

      <div id="swap-status">Trocando unidade...</div>
    </div>

    <div class="footer-splash">
      <img src="MesaLogo.png" alt="Logo" class="mesa-logo">
      <div class="powered-by">Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong></div>
    </div>
  </div>

  <div id="btn-swap-unit" title="Trocar Unidade">&#8644;</div>
  
  <div id="confirm-modal">
    <div class="modal-content">
      <p id="modal-text">Deseja ir para a unidade X?</p>
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" id="modal-cancel">Cancelar</button>
        <button class="btn-modal btn-confirm" id="modal-yes">Sim</button>
      </div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     allow="geolocation; microphone; camera; clipboard-write; autoplay; fullscreen"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation"
  ></iframe>
  
  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const unitCards = document.querySelectorAll('.unit-card');
    const introUI = document.getElementById('intro-ui');
    const swapStatus = document.getElementById('swap-status');
    const offlineToast = document.getElementById('offline-toast');
    const btnSwapUnit = document.getElementById('btn-swap-unit');
    const confirmModal = document.getElementById('confirm-modal');
    const modalText = document.getElementById('modal-text');
    
    let currentUnit = null;
    let targetUnit = null;
    let watchdogTimer = null;

    const unitData = {
      itaquera: { name: "Itaquera", url: "https://script.google.com/macros/s/AKfycbwWmkTFQ4xvbjDpiW_HGqnK69H2faNvjwAj4CbX4RZBfxdjUwVaXE6TmH12BL_VkKWE/exec" },
      carmo: { name: "Carmo", url: "https://script.google.com/macros/s/AKfycbyiRtXfM_TVGZzWS8qnFwALKpmm0_gEYjtXXyygcywQ5F0WXpRk2WcVIOU27Sd7MUu3/exec" }
    };

    // Monitor de Rede
    window.addEventListener('offline', () => offlineToast.classList.add('show'));
    window.addEventListener('online', () => offlineToast.classList.remove('show'));

    // Seleção Inicial
    unitCards.forEach(card => {
      card.addEventListener('click', () => {
        if (!navigator.onLine) { alert("Sem conexão com a internet."); return; }
        
        currentUnit = card.getAttribute('data-unit');
        loadSystem(currentUnit);
      });
    });

    // Função Principal de Carregamento (O Watchdog Timer entra aqui)
    const loadSystem = (unitId) => {
      const url = unitData[unitId].url;
      
      // 1. Ativa a Cortina de Fumaça (Splash com Neon)
      introUI.style.display = 'none'; // Esconde menus
      swapStatus.innerText = `Carregando ${unitData[unitId].name}...`;
      swapStatus.style.display = 'block'; // Mostra texto de carregamento
      
      splash.classList.remove('hidden');
      iframe.classList.remove('loaded');
      btnSwapUnit.classList.remove('visible');

      // 2. Limpa o iframe para forçar reset de memória antes de injetar o novo link
      iframe.src = 'about:blank';
      
      // 3. O Cão de Guarda (Fail-safe). Se o GAS não responder em 15s, a página recarrega inteira.
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(() => {
        console.error("FALHA CRÍTICA: O Google Apps Script não carregou a tempo.");
        window.location.reload(true);
      }, 15000);

      // 4. Injeta a nova URL no iframe
      setTimeout(() => {
        iframe.src = url;
      }, 100);

      // 5. O Sinal de Vida do Iframe
      iframe.onload = () => {
        if (iframe.src === 'about:blank') return; // Ignora o onload do reset de memória
        
        clearTimeout(watchdogTimer); // O Google respondeu, desativa o cão de guarda.
        
        splash.classList.add('hidden');
        iframe.classList.add('loaded');
        btnSwapUnit.classList.add('visible');
      };
    };

    // --- LÓGICA DO BOTÃO SWAP (&#8644;) ---
    btnSwapUnit.addEventListener('click', () => {
      targetUnit = (currentUnit === 'itaquera') ? 'carmo' : 'itaquera';
      modalText.innerText = `Deseja ir para a unidade ${unitData[targetUnit].name}?`;
      confirmModal.classList.add('active');
    });

    document.getElementById('modal-cancel').addEventListener('click', () => confirmModal.classList.remove('active'));
    
    document.getElementById('modal-yes').addEventListener('click', () => {
      confirmModal.classList.remove('active');
      currentUnit = targetUnit; // Atualiza a unidade atual
      loadSystem(currentUnit); // Dispara a troca caindo na função blindada
    });

    // --- REGISTRO DO SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
