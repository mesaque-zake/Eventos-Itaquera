<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Itaquera</title>

  <!-- Google Fonts: Plus Jakarta Sans e Dancing Script -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Mapeamento de Novos Ícones e Manifesto -->
  <link rel="icon" type="image/png" href="./Favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./Icon180.png">

  <!-- Metadados de Cor e Suporte iOS atualizados para Slate-100 -->
  <meta name="theme-color" content="#f1f5f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <!-- Importação do Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            dancing: ['"Dancing Script"', 'cursive'],
          }
        }
      }
    }
  </script>

  <style>
    /* PRESERVAÇÃO INTEGRAL DA ANIMAÇÃO ORIGINAL DO LOGO E POWERED */
    .mesa-container {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      animation: logoUp 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
      transition: opacity 0.5s ease; /* Transição para sumir suavemente no final */
    }

    .powered-container {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      animation: poweredDown 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
      transition: opacity 0.5s ease; /* Transição para sumir suavemente no final */
    }

    @keyframes logoUp { to { top: 60px; transform: translate(-50%, 0); } }
    @keyframes poweredDown { to { top: calc(100% - 60px); transform: translate(-50%, 0); } }

    #offline-toast.show { 
      top: env(safe-area-inset-top, 20px); 
    }

    @media (max-height: 700px) {
      @keyframes logoUp { to { top: 30px; transform: translate(-50%, 0) scale(0.8); } }
      @keyframes poweredDown { to { top: calc(100% - 40px); transform: translate(-50%, 0) scale(0.9); } }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden font-sans m-0 p-0 select-none">

  <!-- Toast Offline Redesenhado -->
  <div id="offline-toast" class="fixed -top-24 left-1/2 -translate-x-1/2 bg-red-50 border border-red-200 text-red-800 px-6 py-3 rounded-full z-[10000] font-semibold text-sm flex items-center gap-2 shadow-md transition-all duration-500 ease-out">
    <span>&#9888;</span> Sem conexão
  </div>

  <!-- Tela Splash principal ajustada para Slate-100 -->
  <div id="splash" class="fixed inset-0 bg-slate-100 z-[9000] flex flex-col justify-center items-center overflow-hidden transition-all duration-700 ease-out">
    
    <!-- Container do Logo (Código original preservado) -->
    <div class="mesa-container">
      <img src="LogoColor.png" alt="Logo" class="w-[105px]">
    </div>

    <!-- Container do Rodapé (Código original preservado) -->
    <div class="powered-container">
      <div class="font-sans text-[0.65rem] text-slate-700 tracking-[1px] font-light mt-[5px]">
        Powered with <span class="text-rose-500">&#10084;</span> by <strong class="font-semibold text-slate-600">Mesaque</strong>
      </div>
    </div>

    <!-- Conteúdo Central: Título e a Aura "Gemini" -->
    <div id="center-content" class="relative z-10 text-center opacity-0 scale-100 transition-all duration-[700ms] ease-[cubic-bezier(0.25,1,0.5,1)]">
      
      <!-- Aura Teal-600 (Oval, inicia fraca e ganha intensidade com o tempo) -->
      <div id="aura-el" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[85vw] h-[18vh] max-w-lg rounded-[100%] bg-teal-600/5 blur-[50px] md:blur-[70px] pointer-events-none opacity-0 scale-75 transition-all duration-[1500ms] ease-out"></div>
      
      <!-- Título com sombreamento leve no "Ações" -->
      <h1 class="font-dancing text-teal-600 text-[6.5rem] md:text-[11rem] leading-[1.1] drop-shadow-[0_4px_12px_rgba(13,148,136,0.25)] pointer-events-none">Ações</h1>
      <h2 class="font-sans text-slate-600 tracking-[14px] text-[1.2rem] md:text-[1.8rem] font-bold uppercase mt-[-10px] pointer-events-none">Educativas</h2>
    </div>

  </div>

  <!-- Iframe do Google Apps Script integrado -->
  <iframe 
    id="app-frame" 
    allow="geolocation; microphone; camera; clipboard-write; autoplay; fullscreen"
    sandbox="allow-downloads allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-top-navigation-by-user-activation allow-modals allow-storage-access-by-user-activation"
    class="w-full h-full border-none block absolute inset-0 opacity-0 invisible transition-opacity duration-700 ease-out bg-slate-100"
  ></iframe>

  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const offlineToast = document.getElementById('offline-toast');
    const logoContainer = document.querySelector('.mesa-container');
    const poweredContainer = document.querySelector('.powered-container');
    const centerContent = document.getElementById('center-content');
    const auraEl = document.getElementById('aura-el');

    // Novo endpoint do Google Apps Script
    const gasUrl = "https://script.google.com/macros/s/AKfycbwHCYVHcCjZs1A0PWOmyfOeWgbwtahoz00VzX_G1oJ0XxX4Ht72Non74kisPovUYMa2/exec";

    let isGasLoaded = false;
    let minTimeElapsed = false;

    window.addEventListener('offline', () => offlineToast.classList.add('show'));
    window.addEventListener('online', () => offlineToast.classList.remove('show'));

    // Inicia carregamento do iframe imediatamente
    iframe.src = gasUrl;

    // --- TIMELINE DE ANIMAÇÕES DO SPLASH ---

    // 1. Após 1.5s (conforme o delay do CSS original), o título começa a surgir
    setTimeout(() => {
      centerContent.classList.remove('opacity-0');
      centerContent.classList.add('opacity-100');
    }, 1500);

    // 2. Após 1.8s, a Aura Teal cresce e ganha forte intensidade
    setTimeout(() => {
      auraEl.classList.remove('opacity-0', 'scale-75', 'bg-teal-600/5');
      auraEl.classList.add('opacity-100', 'scale-[1.25]', 'bg-teal-600/25');
    }, 1800);

    // 3. Tempo mínimo de exposição (3.5 segundos) para manter as transições fluidas
    setTimeout(() => {
      minTimeElapsed = true;
      if (isGasLoaded) {
        revealApp();
      }
    }, 3500);

    // Gatilho executado quando o iframe terminar o carregamento
    iframe.onload = () => {
      isGasLoaded = true;
      if (minTimeElapsed) {
        revealApp();
      }
    };

    // Função de saída e revelação limpa do sistema
    function revealApp() {
      // 1. Logo e Powered desaparecem de forma suave
      logoContainer.classList.add('opacity-0');
      poweredContainer.classList.add('opacity-0');

      // 2. O iframe começa a ser revelado em segundo plano
      iframe.classList.remove('invisible');
      iframe.classList.add('opacity-100');

      // 3. O título e a aura realizam a "sucção" em direção ao ponto central
      centerContent.classList.add('scale-0', 'opacity-0', 'pointer-events-none');

      // 4. Desliga o splash por completo da árvore DOM após as transições
      setTimeout(() => {
        splash.style.display = 'none';
      }, 800);
    }

    // Registro do Service Worker com checagem de atualizações forçada
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            reg.update(); // Força o SW a sincronizar os novos ícones imediatamente
          })
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
