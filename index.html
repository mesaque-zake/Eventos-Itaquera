<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Itaquera</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <meta name="theme-color" content="#2b2bab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <style>
    :root {
      --deep-blue: #762bab;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--deep-blue);
      color: #ffffff;
    }

    /* --- OFFLINE TOAST --- */
    #offline-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 60, 60, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 60, 60, 0.4);
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #offline-toast.show { top: env(safe-area-inset-top, 20px); }

    /* --- IFRAME BLINDADO --- */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease-in, visibility 0.6s;
      background-color: var(--deep-blue);
    }
    iframe.loaded {
      opacity: 1;
      visibility: visible;
    }

    /* --- SPLASH E NEON --- */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--deep-blue);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      transition: opacity 0.6s ease-out, visibility 0.6s;
      overflow: hidden;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
      opacity: 0.8;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .blob-1 { width: 350px; height: 350px; background: #FF0099; top: -100px; left: -100px; animation: neonRun1 4s infinite alternate ease-in-out; }
    .blob-2 { width: 400px; height: 400px; background: #00F0FF; bottom: -100px; right: -100px; animation: neonRun2 3.5s infinite alternate ease-in-out; }
    .blob-3 { width: 300px; height: 300px; background: #b969ff; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: neonRun3 5s infinite alternate-reverse ease-in-out; }

    @keyframes neonRun1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(80vw, 40vh) scale(1.2); } }
    @keyframes neonRun2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-60vw, -30vh) scale(0.8); } }
    @keyframes neonRun3 { 0% { transform: translate(-50%, -50%) scale(0.5); } 50% { transform: translate(20vw, 20vh) scale(1.5); } 100% { transform: translate(-20vw, -40vh) scale(0.5); } }

    #glass-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.03);
      z-index: 1;
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* --- COREOGRAFIA DA TIMELINE (CSS) --- */
    
    /* 1. Logo (Inicia no centro, move no 1.0s) */
    .footer-splash {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform: translate(-50%, 50%) scale(1.6);
      z-index: 10;
      text-align: center;
      width: 100%;
      animation: moveLogo 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: 1.0s;
    }
    @keyframes moveLogo {
      to { bottom: 30px; transform: translate(-50%, 0) scale(1); }
    }
    .mesa-logo { width: 80px; margin-bottom: 8px; opacity: 0.9; filter: brightness(0) invert(1); }
    .powered-by { font-size: 0.65rem; opacity: 0.6; letter-spacing: 1px; font-weight: 300; }

    /* Container Central */
    .center-content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 85%;
      max-width: 400px;
      margin-top: -50px;
    }

    /* 2. Frase Bem Vindo (Aparece no 2.0s) */
    .hero-titles {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
      animation-delay: 2.0s;
    }
    .welcome-text { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 0px; opacity: 0.7; font-weight: 300; }
    .brand-acoes { 
      font-family: 'Dancing Script', cursive; 
      font-size: clamp(6.5rem, 22vw, 11rem); 
      margin: -10px 0; 
      line-height: 1.1; 
      background: linear-gradient(to bottom, #ffffff, #e0e0e0); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.2)); 
    }
    .brand-educativas { 
      font-family: 'Montserrat', sans-serif; 
      font-size: clamp(1.2rem, 5.5vw, 1.8rem); 
      letter-spacing: clamp(8px, 2vw, 14px); 
      margin-top: -5px; 
      text-transform: uppercase; 
      font-weight: 700; 
      color: rgba(255, 255, 255, 0.9); 
      text-shadow: 0 2px 10px rgba(0,0,0,0.2); 
    }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    /* 3. Botão Iniciar (Aparece no 2.5s) */
    .start-container {
      margin-top: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
      animation-delay: 2.5s;
    }

    #btn-start {
      background: #ffffff;
      color: var(--deep-blue);
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 16px 45px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    #btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    #btn-start:active {
      transform: translateY(1px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* Estado: Carregando */
    #btn-start:disabled {
      background: rgba(255, 255, 255, 0.7);
      color: rgba(43, 43, 171, 0.7);
      cursor: wait;
      transform: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    /* Estado: Erro (Timeout) */
    #btn-start.error-state {
      background: #ff4d4d;
      color: #ffffff;
      box-shadow: 0 8px 25px rgba(255, 77, 77, 0.4);
      font-size: 0.9rem;
      padding: 16px 25px;
    }

    @media (max-height: 700px) {
      .brand-acoes { font-size: clamp(4rem, 15vw, 6rem); }
      @keyframes moveLogo { to { bottom: 15px; transform: translate(-50%, 0) scale(1); } }
      .start-container { margin-top: 25px; }
    }
  </style>
</head>
<body>

  <div id="offline-toast"><span>&#9888;</span> Sem conexão de internet</div>

  <div id="splash">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div> 
    <div id="glass-overlay"></div>
    
    <div class="center-content">
      <div id="intro-ui">
        <div class="hero-titles">
          <div class="welcome-text">Bem-vindo a</div>
          <h1 class="brand-acoes">Ações</h1>
          <h2 class="brand-educativas">Educativas</h2>
        </div>
        
        <div class="start-container">
          <button id="btn-start">Iniciar</button>
        </div>
      </div>
    </div>

    <div class="footer-splash">
      <img src="MesaLogo.png" alt="Logo" class="mesa-logo">
      <div class="powered-by">Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong></div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     allow="geolocation; microphone; camera; clipboard-write; autoplay; fullscreen"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation"
  ></iframe>
  
  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const btnStart = document.getElementById('btn-start');
    const offlineToast = document.getElementById('offline-toast');
    
    // URL única (Itaquera)
    const gasUrl = "https://script.google.com/macros/s/AKfycbzHFtQwI0BRTpIpIt9u2MyPhgZURVPFYYmBKV4RtAQ5ZF_3SUabGKimZ4flAyZZgx4y/exec";

    // Variáveis de Estado
    let isGasLoaded = false;
    let hasUserClicked = false;
    let isErrorState = false;

    // Monitor de Rede
    window.addEventListener('offline', () => offlineToast.classList.add('show'));
    window.addEventListener('online', () => offlineToast.classList.remove('show'));

    // 1. O PULO DO GATO: Pré-carregar o iframe no exato momento que o script roda
    iframe.src = gasUrl;

    // 2. O Cão de Guarda (Fail-safe corrigido)
    const watchdogTimer = setTimeout(() => {
      if (!isGasLoaded) {
        isErrorState = true;
        btnStart.innerText = "Falha ao carregar. Tentar novamente?";
        btnStart.classList.add('error-state');
        btnStart.disabled = false; // Habilita para o usuário poder recarregar
      }
    }, 15000);

    // 3. O Sinal de Vida do Iframe (Quando o Google finalmente responde)
    iframe.onload = () => {
      if (iframe.src === 'about:blank') return;
      
      isGasLoaded = true;
      clearTimeout(watchdogTimer); // Desarma o cão de guarda

      // Se o usuário já tinha clicado e estava esperando, libera o app agora
      if (hasUserClicked) {
        revealApp();
      } else {
        // Se ele ainda não clicou, e o botão estava em estado de espera (raro, mas possível)
        if (btnStart.disabled) {
          btnStart.innerText = "Iniciar";
          btnStart.disabled = false;
        }
      }
    };

    // 4. A Lógica de Clique do Botão "Iniciar"
    btnStart.addEventListener('click', () => {
      if (!navigator.onLine) { 
        alert("Sem conexão com a internet."); 
        return; 
      }

      // Se deu erro no timeout, o clique serve para recarregar a página e tentar de novo
      if (isErrorState) {
        window.location.reload();
        return;
      }

      hasUserClicked = true;

      // Verifica as linhas do tempo
      if (isGasLoaded) {
        // Cenário A: O Google já carregou escondido. Revela instantaneamente.
        revealApp();
      } else {
        // Cenário B: O usuário foi muito rápido, o Google ainda está carregando.
        btnStart.innerText = "Aguarde, conectando...";
        btnStart.disabled = true; // Impede múltiplos cliques enquanto espera
      }
    });

    // Função para fazer a transição visual
    function revealApp() {
      splash.classList.add('hidden');
      iframe.classList.add('loaded');
    }

    // --- REGISTRO DO SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
