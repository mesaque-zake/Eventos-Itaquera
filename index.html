<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Itaquera</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <meta name="theme-color" content="#2b2bab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <style>
    :root {
      --primary-color: #4775f5;
      --deep-blue: #2b2bab;
      --accent-glow: #00d2ff;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--deep-blue);
      color: #ffffff;
    }

    /* --- OFFLINE TOAST (VIGIA DE REDE) --- */
    #offline-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 60, 60, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 60, 60, 0.4);
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #offline-toast.show { top: env(safe-area-inset-top, 20px); }

    /* --- IFRAME BLINDADO --- */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease-in, visibility 0.6s;
      background-color: var(--deep-blue); /* Evita flash branco */
    }
    
    iframe.loaded {
      opacity: 1;
      visibility: visible;
    }

    /* --- SPLASH E NEON OTIMIZADO --- */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--deep-blue);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      transition: opacity 0.6s ease-out, visibility 0.6s;
      overflow: hidden;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Neons via Radial Gradient (Alta Performance) */
    .blob {
      position: absolute;
      border-radius: 50%;
      z-index: 0;
      opacity: 0.6;
      mix-blend-mode: screen;
    }

    .blob-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,0,153,0.8) 0%, rgba(255,0,153,0) 70%);
      top: -150px; left: -150px;
      animation: neonPulse 6s infinite alternate ease-in-out;
    }

    .blob-2 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,240,255,0.7) 0%, rgba(0,240,255,0) 70%);
      bottom: -200px; right: -200px;
      animation: neonPulse 5s infinite alternate-reverse ease-in-out;
    }

    .blob-3 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(123,47,190,0.8) 0%, rgba(123,47,190,0) 70%);
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      animation: neonPulse 7s infinite alternate ease-in-out;
    }

    @keyframes neonPulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { transform: scale(1.3) translate(50px, -50px); opacity: 0.6; }
    }

    #glass-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      background: rgba(255, 255, 255, 0.02);
      z-index: 1;
      background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* --- CONTEÚDO E ANIMAÇÕES INICIAIS --- */
    .logo-container {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 85%;
      max-width: 400px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .logo-container.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .welcome-text {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 0px;
      opacity: 0.7;
      font-weight: 300;
    }

    .brand-acoes {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(5rem, 18vw, 9rem); 
      margin: -5px 0;
      line-height: 1.1;
      background: linear-gradient(to bottom, #ffffff, #e0e0e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.2));
    }

    .brand-educativas {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.9rem, 4.5vw, 1.3rem);
      letter-spacing: 12px;
      margin-top: -10px;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    /* --- SELETOR DE UNIDADES --- */
    .unit-selector-container {
      margin-top: 25px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px; 
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 18px 20px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .selector-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 2px 0;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    .unit-options {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .unit-card {
      flex: 1 1 auto;
      min-width: 80px;
      padding: 10px 8px; 
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .unit-card:active { transform: scale(0.95); }
    .unit-card.selected {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }

    .glass-btn {
      margin-top: 4px;
      width: 100%;
      padding: 12px; 
      background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .glass-btn:disabled { opacity: 0.4; pointer-events: none; }
    .glass-btn:not(:disabled):active { transform: scale(0.96); }

    /* --- RODAPÉ E ANIMAÇÃO HERO --- */
    .footer-splash {
      position: absolute;
      z-index: 10;
      text-align: center;
      width: 100%;
      /* Estado Inicial: Centro da tela e Maior */
      top: 45%;
      transform: translateY(-50%) scale(1.6);
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .footer-splash.moved {
      /* Estado Final: Rodapé e Normal */
      top: auto;
      bottom: 40px;
      transform: translateY(0) scale(1);
    }

    .mesa-logo {
      width: 80px;
      margin-bottom: 8px;
      opacity: 0.8;
      filter: brightness(0) invert(1);
    }

    .powered-by {
      font-size: 0.65rem;
      opacity: 0.6;
      letter-spacing: 1px;
      font-weight: 300;
    }

    /* --- BOTÃO FLUTUANTE (VOLTAR) E MODAL --- */
    #btn-back-main {
      position: fixed;
      bottom: 30px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.8);
      transition: all 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-back-main.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }
    #btn-back-main:active { transform: scale(0.9); }

    #confirm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    #confirm-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      width: 80%;
      max-width: 300px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    #confirm-modal.active .modal-content { transform: translateY(0); }
    
    .modal-content p { margin: 0 0 20px 0; font-weight: 500; letter-spacing: 1px; }
    
    .modal-actions { display: flex; gap: 10px; }
    .btn-modal {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
    }
    .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-confirm { background: #fff; color: var(--deep-blue); }

    @media (max-height: 700px) {
      .brand-acoes { font-size: clamp(4rem, 15vw, 6rem); }
      .footer-splash.moved { bottom: 15px; }
    }
  </style>
</head>
<body>

  <div id="offline-toast">
    <span>&#9888;</span> Sem conexão de internet
  </div>

  <div id="splash">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div> 
    <div id="glass-overlay"></div>
    
    <div class="logo-container" id="main-content">
      <div class="welcome-text">Bem-vindo a</div>
      <h1 class="brand-acoes">Ações</h1>
      <h2 class="brand-educativas">Educativas</h2>
      
      <div class="unit-selector-container">
        <p class="selector-title">Selecione sua unidade</p>
        <div class="unit-options">
          <div class="unit-card" data-unit="itaquera">Itaquera</div>
          <div class="unit-card" data-unit="carmo">Carmo</div>
        </div>
        <button id="confirm-btn" class="glass-btn" disabled>Confirmar</button>
      </div>
    </div>

    <div class="footer-splash" id="footer-logo">
      <img src="MesaLogo.png" alt="Logo" class="mesa-logo">
      <div class="powered-by">
        Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong>
      </div>
    </div>
  </div>

  <div id="btn-back-main" title="Voltar à Tela Principal">&#8592;</div>
  
  <div id="confirm-modal">
    <div class="modal-content">
      <p>Voltar à tela principal?</p>
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" id="modal-cancel">Cancelar</button>
        <button class="btn-modal btn-confirm" id="modal-yes">Sim</button>
      </div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     allow="geolocation; microphone; camera; clipboard-write"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads"
  ></iframe>
  
  <script>
    // Referências DOM
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const unitCards = document.querySelectorAll('.unit-card');
    const confirmBtn = document.getElementById('confirm-btn');
    const footerLogo = document.getElementById('footer-logo');
    const mainContent = document.getElementById('main-content');
    const offlineToast = document.getElementById('offline-toast');
    const btnBackMain = document.getElementById('btn-back-main');
    const confirmModal = document.getElementById('confirm-modal');
    
    let selectedUnit = null;
    let isAppOpen = false;

    // Dicionário de Rotas GAS
    const unitLinks = {
      itaquera: "https://script.google.com/macros/s/AKfycbwWmkTFQ4xvbjDpiW_HGqnK69H2faNvjwAj4CbX4RZBfxdjUwVaXE6TmH12BL_VkKWE/exec",
      carmo: "https://script.google.com/macros/s/AKfycbyiRtXfM_TVGZzWS8qnFwALKpmm0_gEYjtXXyygcywQ5F0WXpRk2WcVIOU27Sd7MUu3/exec"
    };

    // --- 1. SEQUÊNCIA DE ANIMAÇÃO INICIAL ---
    window.addEventListener('DOMContentLoaded', () => {
      // Estabelece Ponto Zero do Histórico
      history.replaceState({ screen: 'splash' }, '', window.location.pathname);
      
      // Animação Hero (Logo desce, conteúdo surge)
      setTimeout(() => {
        footerLogo.classList.add('moved');
        mainContent.classList.add('visible');
      }, 1500);
    });

    // --- 2. MONITOR DE CONECTIVIDADE ---
    window.addEventListener('offline', () => offlineToast.classList.add('show'));
    window.addEventListener('online', () => offlineToast.classList.remove('show'));

    // --- 3. LÓGICA DE SELEÇÃO ---
    unitCards.forEach(card => {
      card.addEventListener('click', () => {
        unitCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedUnit = card.getAttribute('data-unit');
        confirmBtn.disabled = false;
      });
    });

    // Transição Suave para o Iframe
    const revealSystem = (unitId) => {
      if (!isAppOpen) {
        isAppOpen = true;
        history.pushState({ screen: 'app' }, '', `#${unitId}`);
        
        splash.classList.add('hidden');
        iframe.classList.add('loaded');
        btnBackMain.classList.add('visible'); // Mostra botão de voltar
      }
    };

    confirmBtn.addEventListener('click', () => {
      if (!selectedUnit || confirmBtn.disabled) return;
      if (!navigator.onLine) {
        alert("Verifique sua conexão de internet para continuar.");
        return;
      }

      const linkDaUnidade = unitLinks[selectedUnit];
      confirmBtn.innerText = "Carregando...";
      confirmBtn.disabled = true;

      // Timeout de segurança (caso o GAS trave por causa da rede)
      window.loadTimeout = setTimeout(() => {
        if (iframe.src !== 'about:blank') revealSystem(selectedUnit);
      }, 8000);

      iframe.src = linkDaUnidade;
      iframe.onload = () => {
        clearTimeout(window.loadTimeout);
        revealSystem(selectedUnit);
      };
    });

    // --- 4. BOTÃO FLUTUANTE DE VOLTAR E MODAL ---
    btnBackMain.addEventListener('click', () => confirmModal.classList.add('active'));
    document.getElementById('modal-cancel').addEventListener('click', () => confirmModal.classList.remove('active'));
    
    document.getElementById('modal-yes').addEventListener('click', () => {
      confirmModal.classList.remove('active');
      // Em vez de matar funções manualmente aqui, forçamos o botão "Voltar" do navegador.
      // Isso engatilha o `popstate` abaixo, que é o nosso Ponto Único de Verdade (Single Source of Truth).
      history.back();
    });

    // --- 5. ORQUESTRADOR DE ESTADOS (POPSTATE) BLINDADO ---
    window.addEventListener('popstate', (event) => {
      if (event.state && event.state.screen === 'splash') {
        isAppOpen = false;
        clearTimeout(window.loadTimeout);
        
        // 1. Esconde a UI do GAS
        btnBackMain.classList.remove('visible');
        iframe.classList.remove('loaded');
        
        // 2. Aguarda a transição de opacidade acabar (evita flash branco)
        setTimeout(() => {
          iframe.src = 'about:blank'; // Purga a memória (OOM Prevent)
          splash.classList.remove('hidden'); // Revela o Splash
          
          // Reseta botão inicial
          confirmBtn.innerText = "Confirmar";
          confirmBtn.disabled = false;
        }, 400); // 400ms é ligeiramente menor que os 0.6s da transição CSS
      }
    });

    // --- REGISTRO DO SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW blindado e registrado!', reg.scope))
          .catch(err => console.log('SW falhou:', err));
      });
    }
  </script>
</body>
</html>
