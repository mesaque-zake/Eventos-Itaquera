<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Itaquera</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <meta name="theme-color" content="#762bab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <style>
    :root {
      --deep-blue: #762bab;
      --bg-black: #08020d;
      --glass-light: rgba(255, 255, 255, 0.12);
      --spotlight-cyan: #00ffff;
      --spotlight-purple: #bf00ff;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-black);
      color: #ffffff;
    }

    /* --- OFFLINE TOAST --- */
    #offline-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 60, 60, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 60, 60, 0.4);
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #offline-toast.show { top: env(safe-area-inset-top, 20px); }

    /* --- IFRAME --- */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease;
      background-color: var(--bg-black); /* Evita flash branco */
    }
    #app-frame.loaded { opacity: 1; visibility: visible; }

    /* --- SPLASH --- */
    #splash {
      position: fixed;
      inset: 0;
      background-color: var(--bg-black); /* Começa Preto */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      transition: opacity 0.6s ease-out;
      overflow: hidden;
      /* Animação para ficar roxo */
      animation: bgToPurple 1.2s ease forwards;
      animation-delay: 1.5s; 
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    @keyframes bgToPurple {
      from { background-color: var(--bg-black); }
      to { background-color: var(--deep-blue); }
    }

    /* HOLOFOTES MELHORADOS (Sem cortes) */
    .spotlight {
      position: absolute;
      width: 250vw; /* Aumentado drasticamente para evitar cortes */
      height: 250vh;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      animation: fadeInSpots 1.5s ease forwards;
    }

    .spot-1 {
      left: -50%; bottom: -50%;
      background: conic-gradient(from 15deg at 20% 80%, transparent 0deg, var(--spotlight-cyan) 4deg, transparent 15deg);
      filter: blur(20px);
      transform-origin: 20% 80%;
      animation: spot1Lantern 10s infinite alternate ease-in-out, fadeInSpots 1.5s ease forwards;
    }

    .spot-2 {
      right: -50%; bottom: -50%;
      background: conic-gradient(from -15deg at 80% 80%, transparent 0deg, var(--spotlight-purple) 4deg, transparent 15deg);
      filter: blur(20px);
      transform-origin: 80% 80%;
      animation: spot2Lantern 9s infinite alternate-reverse ease-in-out, fadeInSpots 1.5s ease forwards;
    }

    .spot-3 {
      left: -50%; top: -50%;
      background: conic-gradient(from 160deg at 20% 20%, transparent 0deg, var(--spotlight-purple) 6deg, transparent 40deg);
      filter: blur(50px);
      transform-origin: 20% 20%;
      animation: spot3Lantern 18s infinite alternate ease-in-out, fadeInSpots 1.5s ease forwards;
    }

    .spot-4 {
      right: -50%; top: -50%;
      background: conic-gradient(from 180deg at 80% 20%, transparent 0deg, var(--spotlight-cyan) 6deg, transparent 40deg);
      filter: blur(50px);
      transform-origin: 80% 20%;
      animation: spot4Lantern 22s infinite alternate-reverse ease-in-out, fadeInSpots 1.5s ease forwards;
    }

    @keyframes fadeInSpots { to { opacity: 0.7; } }
    @keyframes spot1Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(35deg); } }
    @keyframes spot2Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(-35deg); } }
    @keyframes spot3Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(-25deg); } }
    @keyframes spot4Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(25deg); } }

    #glass-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      background: rgba(0, 0, 0, 0.2);
      z-index: 3;
    }

    /* --- LOGOS E TEXTOS --- */
    .mesa-container {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      animation: logoUp 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
    }

    .powered-container {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      animation: poweredDown 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
    }

    @keyframes logoUp { to { top: 60px; transform: translate(-50%, 0); } }
    @keyframes poweredDown { to { top: calc(100% - 60px); transform: translate(-50%, 0); } }

    .mesa-logo { width: 105px; filter: brightness(0) invert(1); opacity: 0.95; }
    .powered-by { font-size: 0.65rem; opacity: 0.7; letter-spacing: 1px; font-weight: 300; margin-top: 5px; }

    /* --- CONTEÚDO CENTRAL --- */
    .center-content {
      position: relative;
      z-index: 10;
      text-align: center;
      opacity: 0;
      animation: fadeInContent 1s ease forwards;
      animation-delay: 2.3s;
    }

    @keyframes fadeInContent { to { opacity: 1; } }

    .welcome-text { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; opacity: 0.7; font-weight: 300; }

    .brand-acoes { 
      font-family: 'Dancing Script', cursive;
      font-size: clamp(6.5rem, 22vw, 11rem); 
      margin: -10px 0; 
      line-height: 1.1; 
      background: linear-gradient(to bottom, #ffffff, #f0f0f0); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.4)); 
    }

    .brand-educativas { 
      font-family: 'Montserrat', sans-serif; 
      font-size: clamp(1.2rem, 5.5vw, 1.8rem); 
      letter-spacing: clamp(8px, 2vw, 14px); 
      text-transform: uppercase; 
      font-weight: 700; 
      color: rgba(255, 255, 255, 0.95); 
    }

    /* --- BOTÃO --- */
    .start-container { margin-top: 45px; }
    #btn-start {
      position: relative;
      background: var(--glass-light);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 18px 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    #btn-start::after {
      content: '';
      position: absolute;
      top: -50%; left: -100%;
      width: 50%; height: 200%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(30deg);
      animation: shine 4s infinite;
    }

    @keyframes shine { 0% { left: -100%; } 20% { left: 150%; } 100% { left: 150%; } }
    #btn-start:active { transform: scale(0.96); }
    #btn-start:disabled { opacity: 0.6; cursor: wait; }

    @media (max-height: 700px) {
      .brand-acoes { font-size: clamp(4rem, 15vw, 6rem); }
      @keyframes logoUp { to { top: 30px; transform: translate(-50%, 0) scale(0.8); } }
      @keyframes poweredDown { to { top: calc(100% - 40px); transform: translate(-50%, 0) scale(0.9); } }
    }
  </style>
</head>
<body>

  <div id="offline-toast"><span>&#9888;</span> Sem conexão</div>

  <div id="splash">
    <div class="spotlight spot-1"></div>
    <div class="spotlight spot-2"></div>
    <div class="spotlight spot-3"></div>
    <div class="spotlight spot-4"></div> 
    
    <div id="glass-overlay"></div>

    <div class="mesa-container">
      <img src="MesaLogo.png" alt="Logo" class="mesa-logo">
    </div>

    <div class="powered-container">
      <div class="powered-by">Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong></div>
    </div>

    <div class="center-content">
      <div class="welcome-text">Bem-vindo a</div>
      <h1 class="brand-acoes">Ações</h1>
      <h2 class="brand-educativas">Educativas</h2>

      <div class="start-container">
        <button id="btn-start">Iniciar</button>
      </div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     allow="geolocation; microphone; camera; clipboard-write; autoplay; fullscreen"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-top-navigation-by-user-activation allow-modals allow-storage-access-by-user-activation"
  ></iframe>

  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const btnStart = document.getElementById('btn-start');
    const offlineToast = document.getElementById('offline-toast');

    const gasUrl = "https://script.google.com/macros/s/AKfycby70vtn4tSVskpCu-JtuZMer6wtgzGeoutc-3xSq_FRspmY72Xomm47pA-E06-SGBInOw/exec";

    let isGasLoaded = false;
    let hasUserClicked = false;

    window.addEventListener('offline', () => offlineToast.classList.add('show'));
    window.addEventListener('online', () => offlineToast.classList.remove('show'));

    // Inicia carregamento do iframe imediatamente
    iframe.src = gasUrl;

    // Timeout de segurança
    const watchdogTimer = setTimeout(() => {
      if (!isGasLoaded) {
        btnStart.innerText = "Tentar carregar novamente";
        btnStart.disabled = false;
      }
    }, 15000);

    iframe.onload = () => {
      isGasLoaded = true;
      clearTimeout(watchdogTimer);
      // Se o usuário já clicou enquanto carregava, revela agora
      if (hasUserClicked) {
        revealApp();
      } else {
        btnStart.innerText = "Iniciar";
        btnStart.disabled = false;
      }
    };

    btnStart.addEventListener('click', () => {
      if (!navigator.onLine) { alert("Sem conexão."); return; }
      
      hasUserClicked = true;
      
      if (isGasLoaded) {
        revealApp();
      } else {
        btnStart.innerText = "Conectando...";
        btnStart.disabled = true;
      }
    });

    function revealApp() {
      // Pequeno delay para garantir que o iframe rendeu antes de sumir o splash
      setTimeout(() => {
        iframe.classList.add('loaded');
        splash.classList.add('hidden');
      }, 300);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
