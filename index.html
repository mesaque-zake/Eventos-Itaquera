<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Itaquera</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <meta name="theme-color" content="#762bab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <style>
    :root {
      --deep-purple: #762bab;
      --glass-white: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
    }

    body, html {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #1a0a2a; /* Fundo mais profundo para destacar os holofotes */
      color: #ffffff;
    }

    /* --- OFFLINE TOAST --- */
    #offline-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 60, 60, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 60, 60, 0.4);
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 10000;
      font-weight: 600;
      font-size: 0.85rem;
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #offline-toast.show { top: env(safe-area-inset-top, 20px); }

    /* --- IFRAME --- */
    iframe {
      width: 100%; height: 100%;
      border: none; display: block;
      opacity: 0; visibility: hidden;
      transition: opacity 0.8s ease;
      background-color: var(--deep-purple);
    }
    iframe.loaded { opacity: 1; visibility: visible; }

    /* --- SPLASH E CENÁRIO --- */
    #splash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #3a1557 0%, #1a0a2a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      transition: opacity 0.7s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    /* --- HOLOFOTES (SPOTLIGHTS) --- */
    .spotlight {
      position: absolute;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(118, 43, 171, 0.4) 0%, rgba(118, 43, 171, 0) 70%);
      filter: blur(60px);
      z-index: 1;
      pointer-events: none;
    }
    .spot-1 {
      top: -10%; left: -10%;
      animation: spotMove1 12s infinite alternate ease-in-out;
    }
    .spot-2 {
      bottom: -10%; right: -10%;
      animation: spotMove2 15s infinite alternate ease-in-out;
    }

    @keyframes spotMove1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50vw, 30vh) scale(1.3); }
    }
    @keyframes spotMove2 {
      0% { transform: translate(0, 0) scale(1.2); }
      100% { transform: translate(-40vw, -40vh) scale(1); }
    }

    /* --- LOGO E POWERED (A DIVISÃO) --- */
    .brand-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      width: 100%;
    }

    .header-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.4);
      animation: splitToTop 1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
      z-index: 25;
    }

    .footer-powered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: splitToBottom 1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
      text-align: center;
      opacity: 1;
      width: 100%;
    }

    @keyframes splitToTop {
      to { top: env(safe-area-inset-top, 40px); transform: translate(-50%, 0) scale(1); }
    }
    @keyframes splitToBottom {
      to { top: auto; bottom: env(safe-area-inset-bottom, 30px); transform: translate(-50%, 0); }
    }

    .mesa-logo { width: 90px; filter: brightness(0) invert(1); opacity: 0.9; }
    .powered-by { font-size: 0.65rem; letter-spacing: 2px; opacity: 0.5; margin-top: 8px; font-weight: 300; text-transform: uppercase; }

    /* --- CONTEÚDO CENTRAL (REVELADO APÓS A DIVISÃO) --- */
    .center-content {
      text-align: center;
      z-index: 10;
      opacity: 0;
      transform: translateY(20px);
      animation: revealCenter 0.8s ease-out forwards;
      animation-delay: 2.2s;
    }

    @keyframes revealCenter {
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-text { 
      font-size: 0.8rem; 
      text-transform: uppercase; 
      letter-spacing: 5px; 
      margin-bottom: -15px; 
      font-weight: 300; 
      color: rgba(255,255,255,0.6);
    }

    .brand-acoes { 
      font-family: 'Dancing Script', cursive; 
      font-size: clamp(6rem, 20vw, 10rem); 
      margin: 0;
      background: linear-gradient(to bottom, #ffffff, #d1d1d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
    }

    .brand-educativas { 
      font-size: clamp(1rem, 5vw, 1.5rem); 
      letter-spacing: 12px; 
      text-transform: uppercase; 
      font-weight: 700; 
      margin-top: -20px;
      color: rgba(255,255,255,0.9);
    }

    /* --- BOTÃO GLASSMORPHISM --- */
    .start-container {
      margin-top: 50px;
    }

    #btn-start {
      position: relative;
      overflow: hidden;
      background: var(--glass-white);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: #ffffff;
      padding: 18px 50px;
      border-radius: 40px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Efeito de brilho passando pelo botão */
    #btn-start::after {
      content: '';
      position: absolute;
      top: -50%; left: -60%;
      width: 50%; height: 200%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(25deg);
      animation: glassShine 4s infinite;
    }

    @keyframes glassShine {
      0% { left: -60%; }
      20% { left: 120%; }
      100% { left: 120%; }
    }

    #btn-start:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }
    #btn-start:disabled { opacity: 0.6; cursor: wait; }
    
    #btn-start.error-state { background: rgba(255, 77, 77, 0.3); border-color: #ff4d4d; }

    @media (max-height: 700px) {
      .brand-acoes { font-size: 5rem; }
      .brand-educativas { font-size: 0.9rem; letter-spacing: 8px; }
      .start-container { margin-top: 30px; }
    }
  </style>
</head>
<body>

  <div id="offline-toast"><span>&#9888;</span> Sem conexão de internet</div>

  <div id="splash">
    <div class="spotlight spot-1"></div>
    <div class="spotlight spot-2"></div>

    <div class="header-logo">
      <img src="MesaLogo.png" alt="Logo" class="mesa-logo">
    </div>

    <div class="footer-powered">
      <div class="powered-by">Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong></div>
    </div>

    <div class="center-content">
      <div class="welcome-text">Bem-vindo a</div>
      <h1 class="brand-acoes">Ações</h1>
      <h2 class="brand-educativas">Educativas</h2>
      
      <div class="start-container">
        <button id="btn-start">Iniciar</button>
      </div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     allow="geolocation; microphone; camera; clipboard-write; autoplay; fullscreen"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation"
  ></iframe>

  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const btnStart = document.getElementById('btn-start');
    const offlineToast = document.getElementById('offline-toast');
    
    // URL GAS (Original mantida)
    const gasUrl = "https://script.google.com/macros/s/AKfycbywcCRHCJ3QU0GJpglv6j4dsK8LmuYIwcNiesK_1lcoXPS8--YKpLhRsQgb92irTdk/exec";

    let isGasLoaded = false;
    let hasUserClicked = false;
    let isErrorState = false;

    window.addEventListener('offline', () => offlineToast.classList.add('show'));
    window.addEventListener('online', () => offlineToast.classList.remove('show'));

    // Pré-carregamento silencioso
    iframe.src = gasUrl;

    const watchdogTimer = setTimeout(() => {
      if (!isGasLoaded) {
        isErrorState = true;
        btnStart.innerText = "Reconectar?";
        btnStart.classList.add('error-state');
        btnStart.disabled = false;
      }
    }, 15000);

    iframe.onload = () => {
      if (iframe.src === 'about:blank') return;
      isGasLoaded = true;
      clearTimeout(watchdogTimer);
      if (hasUserClicked) revealApp();
      else if (btnStart.disabled) {
        btnStart.innerText = "Iniciar";
        btnStart.disabled = false;
      }
    };

    btnStart.addEventListener('click', () => {
      if (!navigator.onLine) { alert("Sem conexão com a internet."); return; }
      if (isErrorState) { window.location.reload(); return; }

      hasUserClicked = true;
      if (isGasLoaded) {
        revealApp();
      } else {
        btnStart.innerText = "Conectando...";
        btnStart.disabled = true;
      }
    });

    function revealApp() {
      splash.classList.add('hidden');
      iframe.classList.add('loaded');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
