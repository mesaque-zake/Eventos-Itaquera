<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Itaquera</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <meta name="theme-color" content="#762bab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <style>
    :root {
      --deep-blue: #762bab;
      --glass-light: rgba(255, 255, 255, 0.12);
      
      /* NOVAS CORES DOS HOLOFOTES: Super Intensas */
      --spotlight-cyan: #00FFFF;   /* Ciano Elétrico Puro */
      --spotlight-purple: #B026FF; /* Roxo Neon / Ultravioleta Puro */
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #1a0a2a; /* Fundo escuro para destacar as luzes intensas */
      color: #ffffff;
    }

    /* --- OFFLINE TOAST --- */
    #offline-toast {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 60, 60, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 60, 60, 0.4);
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #offline-toast.show { top: env(safe-area-inset-top, 20px); }

    /* --- IFRAME --- */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in;
      background-color: var(--deep-blue);
    }
    iframe.loaded { opacity: 1; visibility: visible; }

    /* --- SPLASH E HOLOFOTES INTENSOS --- */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--deep-blue);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9000;
      transition: opacity 0.8s ease-out;
      overflow: hidden;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Base fixa e tamanhos mantidos, mas intensidade máxima */
    .spotlight {
      position: absolute;
      width: 130vw;
      height: 150vh;
      pointer-events: none;
      filter: blur(40px);
      opacity: 1; /* Intensidade Máxima */
      mix-blend-mode: screen; /* Fusão de luz perfeita contra o fundo escuro */
    }

    .spot-1 {
      /* Base: Canto Inferior Esquerdo (Ciano Puro) */
      left: 0; bottom: 0;
      background: radial-gradient(circle at 0% 100%, var(--spotlight-cyan) 0%, rgba(0,255,255,0) 70%);
      transform-origin: 0% 100%;
      animation: spot1Motion 15s infinite alternate ease-in-out;
    }

    .spot-2 {
      /* Base: Canto Inferior Direito (Roxo Neon Puro/Mais forte) */
      right: 0; bottom: 0;
      background: radial-gradient(circle at 100% 100%, var(--spotlight-purple) 0%, rgba(176,38,255,0) 70%);
      transform-origin: 100% 100%;
      width: 150vw; /* Mantido Maior */
      opacity: 1;  /* Intensidade Máxima */
      animation: spot2Motion 12s infinite alternate ease-in-out;
    }

    @keyframes spot1Motion {
      0% { transform: rotate(0deg); opacity: 0.9; }
      100% { transform: rotate(25deg); opacity: 1; }
    }

    @keyframes spot2Motion {
      0% { transform: rotate(0deg); opacity: 0.8; }
      100% { transform: rotate(-25deg); opacity: 1; }
    }

    #glass-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.15); /* Vidro jateado levemente escuro para contraste */
      z-index: 3;
    }

    /* --- COREOGRAFIA INICIAL CORRIGIDA E SUAVE --- */
    
    /* MESA CONTAINER (Logo) */
    .mesa-container {
      position: absolute;
      left: 50%;
      top: 44%; /* AJUSTE: Começa acima do centro (44%) */
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      /* MANTIDO: Mesma animação cubic-bezier suave */
      animation: logoUp 1.3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
    }

    /* POWERED CONTAINER (Texto de rodapé) */
    .powered-container {
      position: absolute;
      left: 50%;
      top: 56%; /* AJUSTE: Começa abaixo do centro (56%), usando 'top' para consistência */
      transform: translate(-50%, -50%); /* Ajustado para centralizar com base no 'top' */
      z-index: 10;
      text-align: center;
      /* MANTIDO: Mesma animação cubic-bezier suave */
      animation: poweredDown 1.3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      animation-delay: 1.5s;
    }

    /* Animações mantidas: subindo e descendo suaves para os cantos */
    @keyframes logoUp { to { top: 60px; transform: translate(-50%, 0); } }
    @keyframes poweredDown { to { top: auto; bottom: 30px; transform: translate(-50%, 0); } }

    .mesa-logo { width: 105px; filter: brightness(0) invert(1); opacity: 0.9; }
    .powered-by { font-size: 0.65rem; opacity: 0.6; letter-spacing: 1px; font-weight: 300; margin-top: 5px; }

    /* --- CONTEÚDO CENTRAL (REVELADO DEPOIS) --- */
    .center-content {
      position: relative;
      z-index: 10;
      text-align: center;
      opacity: 0;
      animation: fadeInContent 1s ease forwards;
      animation-delay: 2.2s;
    }

    @keyframes fadeInContent { to { opacity: 1; } }

    /* MANTIDO: Tamanhos de fonte e Dancing Script sagrada */
    .welcome-text { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; opacity: 0.7; font-weight: 300; }
    
    .brand-acoes { 
      font-family: 'Dancing Script', cursive; 
      font-size: clamp(6.5rem, 22vw, 11rem); 
      margin: -10px 0; 
      line-height: 1.1; 
      background: linear-gradient(to bottom, #ffffff, #f0f0f0); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.3)); 
    }

    .brand-educativas { 
      font-family: 'Montserrat', sans-serif; 
      font-size: clamp(1.2rem, 5.5vw, 1.8rem); 
      letter-spacing: clamp(8px, 2vw, 14px); 
      text-transform: uppercase; 
      font-weight: 700; 
      color: rgba(255, 255, 255, 0.95); 
    }

    /* --- BOTÃO INICIAR (GLASSMORPHISM REFLEXIVO) --- */
    .start-container { margin-top: 45px; }

    /* MANTIDO: Tamanho de fonte e padding original do botão */
    #btn-start {
      position: relative;
      background: var(--glass-light);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 18px 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    /* Efeito de Reflexo Jateado (4s loop) */
    #btn-start::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 50%;
      height: 200%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(30deg);
      transition: none;
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      20% { left: 150%; }
      100% { left: 150%; }
    }

    #btn-start:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }
    #btn-start:disabled { opacity: 0.6; cursor: wait; }

    /* Responsividade Mobile (MANTIDA) */
    @media (max-height: 700px) {
      .brand-acoes { font-size: clamp(4rem, 15vw, 6rem); }
      @keyframes logoUp { to { top: 30px; transform: translate(-50%, 0) scale(0.8); } }
    }
  </style>
</head>
<body>

  <div id="offline-toast"><span>&#9888;</span> Sem conexão</div>

  <div id="splash">
    <div class="spotlight spot-1"></div>
    <div class="spotlight spot-2"></div>
    <div id="glass-overlay"></div>
    
    <div class="mesa-container">
      <img src="MesaLogo.png" alt="Logo" class="mesa-logo">
    </div>

    <div class="powered-container">
      <div class="powered-by">Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong></div>
    </div>

    <div class="center-content">
      <div class="welcome-text">Bem-vindo a</div>
      <h1 class="brand-acoes">Ações</h1>
      <h2 class="brand-educativas">Educativas</h2>
      
      <div class="start-container">
        <button id="btn-start">Iniciar</button>
      </div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     allow="geolocation; microphone; camera; clipboard-write; autoplay; fullscreen"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation"
  ></iframe>
  
  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const btnStart = document.getElementById('btn-start');
    const offlineToast = document.getElementById('offline-toast');
    
    const gasUrl = "https://script.google.com/macros/s/AKfycbywcCRHCJ3QU0GJpglv6j4dsK8LmuYIwcNiesK_1lcoXPS8--YKpLhRsQgb92irTdk/exec";

    let isGasLoaded = false;
    let hasUserClicked = false;
    let isErrorState = false;

    window.addEventListener('offline', () => offlineToast.classList.add('show'));
    window.addEventListener('online', () => offlineToast.classList.remove('show'));

    iframe.src = gasUrl;

    const watchdogTimer = setTimeout(() => {
      if (!isGasLoaded) {
        isErrorState = true;
        btnStart.innerText = "Falha ao carregar. Tentar de novo?";
        btnStart.disabled = false;
      }
    }, 15000);

    iframe.onload = () => {
      if (iframe.src === 'about:blank') return;
      isGasLoaded = true;
      clearTimeout(watchdogTimer);
      if (hasUserClicked) revealApp();
      else if (btnStart.disabled) {
        btnStart.innerText = "Iniciar";
        btnStart.disabled = false;
      }
    };

    btnStart.addEventListener('click', () => {
      if (!navigator.onLine) { alert("Sem conexão."); return; }
      if (isErrorState) { window.location.reload(); return; }

      hasUserClicked = true;
      if (isGasLoaded) revealApp();
      else {
        btnStart.innerText = "Conectando...";
        btnStart.disabled = true;
      }
    });

    function revealApp() {
      splash.classList.add('hidden');
      iframe.classList.add('loaded');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
