<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ações Educativas - Sesc Mesa Brasil</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#2b2bab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ações Ed">

  <meta property="og:title" content="Ações Educativas - Sesc">
  <meta property="og:description" content="Gestão das Ações Educativas do Sesc Mesa Brasil.">
  <meta property="og:image" content="https://raw.githubusercontent.com/mesaque-zake/Eventos-Itaquera/refs/heads/main/social-Share.png">
  <meta property="og:url" content="https://mesaque-zake.github.io/Eventos-Itaquera/">
  <meta property="og:type" content="website">

  <style>
    :root {
      --deep-blue: #1a1a4b;
    }

    body, html {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--deep-blue);
      -webkit-font-smoothing: antialiased;
    }

    /* --- ESTILO DO SPLASH --- */
    #splash {
      position: fixed; inset: 0;
      background: var(--deep-blue);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out, visibility 0.8s;
      overflow: hidden;
      padding-top: env(safe-area-inset-top); 
      box-sizing: border-box;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* --- EFEITO NEON PREMIUM (RADIAL GRADIENT = ALTA PERFORMANCE) --- */
    .blob {
      position: absolute;
      border-radius: 50%;
      z-index: 0;
      mix-blend-mode: screen;
    }
    .blob-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,0,153,0.8) 0%, rgba(255,0,153,0) 70%);
      animation: neonRun1 6s infinite alternate ease-in-out, pulse 3s infinite alternate;
    }
    .blob-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,240,255,0.7) 0%, rgba(0,240,255,0) 70%);
      animation: neonRun2 5s infinite alternate ease-in-out, pulse 4s infinite alternate;
    }
    .blob-3 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(123,47,190,0.8) 0%, rgba(123,47,190,0) 70%);
      animation: neonRun3 7s infinite alternate-reverse ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }
    @keyframes neonRun1 {
      0% { top: -20%; left: -20%; }
      100% { top: 60%; left: 80%; }
    }
    @keyframes neonRun2 {
      0% { bottom: -20%; right: -20%; }
      100% { bottom: 70%; right: 60%; }
    }
    @keyframes neonRun3 {
      0% { top: 50%; left: 50%; transform: translate(-50%, -50%); }
      50% { top: 20%; left: 80%; }
      100% { top: 80%; left: 20%; }
    }

    /* Camada de Vidro */
    #glass-overlay {
      position: absolute; inset: 0;
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    /* --- ANIMAÇÃO INTRO (HERO TO FOOTER) --- */
    .footer-splash {
      position: absolute;
      z-index: 15;
      text-align: center;
      width: 100%;
      /* Posição Inicial: Centro da Tela */
      top: 45%;
      transform: translateY(-50%) scale(1.5);
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .footer-splash.settled {
      /* Posição Final: Rodapé */
      top: auto;
      bottom: 40px;
      transform: translateY(0) scale(1);
    }
    .mesa-logo {
      width: 80px; margin-bottom: 8px;
      filter: brightness(0) invert(1);
    }
    .powered-by {
      font-size: 0.65rem; opacity: 0.6; letter-spacing: 1px; color: #FFF; font-weight: 300;
    }

    /* Container do Conteúdo Central */
    .logo-container {
      position: relative; z-index: 10;
      text-align: center; color: #FFF;
      width: 85%; max-width: 400px;
      opacity: 0; visibility: hidden;
      transform: translateY(20px);
      transition: all 0.8s ease-out;
    }
    .logo-container.visible {
      opacity: 1; visibility: visible; transform: translateY(0);
    }

    .welcome-text { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; opacity: 0.8; font-weight: 300; }
    .brand-acoes { font-family: 'Dancing Script', cursive; font-size: clamp(5rem, 18vw, 8rem); margin: -5px 0; line-height: 1.1; text-shadow: 0px 5px 15px rgba(0,0,0,0.5); }
    .brand-educativas { font-size: clamp(0.9rem, 4.5vw, 1.3rem); letter-spacing: 12px; margin-top: -10px; text-transform: uppercase; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

    /* --- SELEÇÃO DE UNIDADE (GLASSMORPHISM) --- */
    .unit-selector-container {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px;
      padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .selector-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 10px 0; color: #FFF; font-weight: 600; }
    .unit-options { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;}
    .unit-card {
      flex: 1; padding: 12px 5px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      color: rgba(255, 255, 255, 0.8); font-weight: 500; font-size: 0.95rem;
      cursor: pointer; transition: all 0.3s ease; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .unit-card.selected { background: rgba(255, 255, 255, 0.25); border-color: #FFF; color: #FFF; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); font-weight: 700; }
    
    .glass-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 12px;
      color: #fff; font-weight: 700; font-size: 1rem; letter-spacing: 1px;
      cursor: pointer; transition: all 0.3s ease; font-family: 'Montserrat', sans-serif;
    }
    .glass-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* --- COMPONENTES PÓS-CARREGAMENTO --- */
    iframe { width: 100%; height: 100%; border: none; display: block; opacity: 0; transition: opacity 0.5s; background: #FFF; }
    iframe.loaded { opacity: 1; }

    /* Botão Flutuante (FAB) - Home */
    #fab-home {
      position: fixed; bottom: 30px; right: 20px;
      width: 55px; height: 55px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; justify-content: center; align-items: center;
      color: #FFF; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 10000; cursor: pointer; transition: all 0.3s;
      opacity: 0; visibility: hidden; transform: scale(0.8);
    }
    #fab-home.visible { opacity: 1; visibility: visible; transform: scale(1); }
    #fab-home:active { transform: scale(0.9); }

    /* Modal de Confirmação (Glass) */
    #confirm-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center;
      z-index: 10001; opacity: 0; visibility: hidden; transition: opacity 0.3s;
    }
    #confirm-modal.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2);
      padding: 25px; border-radius: 20px; text-align: center; width: 80%; max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #FFF;
    }
    .modal-content h3 { margin: 0 0 20px 0; font-weight: 500; font-size: 1.1rem; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; }
    .btn-cancel { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #FFF; font-weight: 600; cursor: pointer;}
    .btn-confirm { flex: 1; padding: 12px; background: rgba(255,0,153,0.6); border: none; border-radius: 8px; color: #FFF; font-weight: 600; cursor: pointer;}

    /* Toast de Conectividade */
    #network-toast {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(255, 50, 50, 0.9); backdrop-filter: blur(10px);
      color: #FFF; text-align: center; padding: 15px 0; padding-top: calc(15px + env(safe-area-inset-top));
      font-weight: 600; font-size: 0.9rem; z-index: 20000;
      transform: translateY(-100%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    #network-toast.offline { transform: translateY(0); }

    @media (max-height: 700px) {
      .brand-acoes { font-size: clamp(4rem, 15vw, 6rem); }
      .footer-splash.settled { bottom: 15px; }
    }
  </style>
</head>
<body>

  <div id="network-toast">⚠️ Sem conexão com a internet</div>

  <div id="splash">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div> 
    <div id="glass-overlay"></div>
    
    <div class="footer-splash" id="footer-hero">
      <img src="MesaLogo.png" alt="Logo Mesa" class="mesa-logo" onerror="this.style.display='none'">
      <div class="powered-by">Powered with <span style="color: #FF0099;">&#10084;</span> by <strong>Mesaque</strong></div>
    </div>

    <div class="logo-container" id="main-content">
      <div class="welcome-text">Bem-vindo a</div>
      <h1 class="brand-acoes">Ações</h1>
      <h2 class="brand-educativas">Educativas</h2>
      
      <div class="unit-selector-container">
        <p class="selector-title">Selecione sua unidade</p>
        <div class="unit-options">
          <div class="unit-card" data-unit="itaquera">Itaquera</div>
          <div class="unit-card" data-unit="carmo">Carmo</div>
        </div>
        <button id="confirm-btn" class="glass-btn" disabled>Acessar Sistema</button>
      </div>
    </div>
  </div>

  <iframe 
     id="app-frame" 
     allow="geolocation; microphone; camera; clipboard-write"
     sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-presentation">
  </iframe>

  <div id="fab-home">🏠</div>

  <div id="confirm-modal">
    <div class="modal-content">
      <h3>Deseja voltar à tela principal e sair da unidade atual?</h3>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">Cancelar</button>
        <button class="btn-confirm" id="modal-confirm">Sim, voltar</button>
      </div>
    </div>
  </div>
  
  <script>
    // --- ESTADOS E DOM ---
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app-frame');
    const footerHero = document.getElementById('footer-hero');
    const mainContent = document.getElementById('main-content');
    const unitCards = document.querySelectorAll('.unit-card');
    const confirmBtn = document.getElementById('confirm-btn');
    const fabHome = document.getElementById('fab-home');
    const modal = document.getElementById('confirm-modal');
    const networkToast = document.getElementById('network-toast');
    
    let selectedUnit = null;
    let isAppOpen = false;

    // Dicionário de Rotas GAS
    const unitLinks = {
      itaquera: "https://script.google.com/macros/s/AKfycbwWmkTFQ4xvbjDpiW_HGqnK69H2faNvjwAj4CbX4RZBfxdjUwVaXE6TmH12BL_VkKWE/exec",
      carmo: "https://script.google.com/macros/s/AKfycbyiRtXfM_TVGZzWS8qnFwALKpmm0_gEYjtXXyygcywQ5F0WXpRk2WcVIOU27Sd7MUu3/exec"
    };

    // --- 1. SEQUÊNCIA DE ANIMAÇÃO INICIAL ---
    window.addEventListener('load', () => {
      // Define a "Home" no histórico
      history.replaceState({ screen: 'splash' }, '', window.location.pathname);
      
      // Animação Cinematográfica
      setTimeout(() => {
        footerHero.classList.add('settled'); // Desce o logo
        setTimeout(() => {
          mainContent.classList.add('visible'); // Revela o painel
        }, 500);
      }, 1500);
    });

    // --- 2. LÓGICA DE SELEÇÃO DE UNIDADE ---
    unitCards.forEach(card => {
      card.addEventListener('click', () => {
        unitCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedUnit = card.getAttribute('data-unit');
        confirmBtn.disabled = false;
      });
    });

    // Função que mostra o Iframe pronto
    const revealSystem = (unitId) => {
      if (!isAppOpen) {
        isAppOpen = true;
        history.pushState({ screen: 'app' }, '', `#${unitId}`);
        splash.classList.add('hidden');
        iframe.classList.add('loaded');
        fabHome.classList.add('visible'); // Mostra botão de voltar
        confirmBtn.innerText = "Acessar Sistema"; // Reseta o botão para o futuro
      }
    };

    confirmBtn.addEventListener('click', () => {
      if (!selectedUnit || confirmBtn.disabled) return;
      const link = unitLinks[selectedUnit];

      confirmBtn.innerText = "Carregando sistema...";
      confirmBtn.disabled = true;

      // Timeout de segurança (cancelável)
      window.loadTimeout = setTimeout(() => {
        if (iframe.src !== 'about:blank') revealSystem(selectedUnit);
      }, 8000);

      iframe.src = link;
      iframe.onload = () => {
        clearTimeout(window.loadTimeout);
        revealSystem(selectedUnit);
      };
    });

    // --- 3. BOTÃO FLUTUANTE E MODAL (O "VOLTAR") ---
    fabHome.addEventListener('click', () => {
      modal.classList.add('active');
    });

    document.getElementById('modal-cancel').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    document.getElementById('modal-confirm').addEventListener('click', () => {
      modal.classList.remove('active');
      // A mágica: acionar o botão voltar do próprio navegador!
      history.back(); 
    });

    // --- 4. O GUARDIÃO DO ESTADO (POPSTATE) ---
    // Executado tanto se o usuário clicar no botão do celular, quanto no nosso botão "Sim, voltar"
    window.addEventListener('popstate', (event) => {
      if (event.state && event.state.screen === 'splash') {
        isAppOpen = false;
        clearTimeout(window.loadTimeout); // Cancela carregamentos zumbis
        
        // Esconde o app, mostra as luzes neon
        fabHome.classList.remove('visible');
        modal.classList.remove('active'); // Garante que fecha se o hardware back foi apertado com ele aberto
        splash.classList.remove('hidden');
        iframe.classList.remove('loaded');
        
        // Limpa a RAM do celular!
        setTimeout(() => { iframe.src = 'about:blank'; }, 400); 
        
        // Reseta UI
        confirmBtn.disabled = false;
        confirmBtn.innerText = "Acessar Sistema";
      }
    });

    // --- 5. MONITOR DE REDE ---
    window.addEventListener('offline', () => networkToast.classList.add('offline'));
    window.addEventListener('online', () => networkToast.classList.remove('offline'));

    // --- 6. SERVICE WORKER (Para PWA funcionar offline) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado com sucesso!'))
          .catch(err => console.log('Erro no SW:', err));
      });
    }
  </script>
</body>
</html>
